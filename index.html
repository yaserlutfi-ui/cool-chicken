        let cart = [];

        function renderProducts(category = 'all') {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            const filtered = category === 'all' ? products : products.filter(p => p.category === category);

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-md hover:border-indigo-300 cursor-pointer transition active:scale-95";
                card.onclick = () => addToCart(p);
                card.innerHTML = `
                    <div>
                        <div class="font-bold text-gray-800 text-base mb-1">${p.name}</div>
                        <div class="text-xs text-gray-500 mb-3">${p.desc}</div>
                    </div>
                    <div class="text-indigo-600 font-extrabold text-lg">${p.price} TL</div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-4 py-2 bg-gray-100 text-gray-700 rounded-xl text-sm font-semibold whitespace-nowrap hover:bg-gray-200 transition";
            });
            btnElement.className = "cat-btn px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-semibold whitespace-nowrap shadow-sm transition";
            renderProducts(category);
        }

        function addToCart(product) {
            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        function changeQuantity(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('cart-list');
            const itemCount = document.getElementById('item-count');
            const cartTotal = document.getElementById('cart-total');
            
            list.innerHTML = '';
            if (cart.length === 0) {
                list.innerHTML = '<p class="text-gray-400 text-center py-10">Henüz ürün seçilmedi.</p>';
                itemCount.innerText = '0 Ürün';
                cartTotal.innerText = '0.00 TL';
                return;
            }

            let total = 0;
            let totalCount = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                totalCount += item.quantity;

                const row = document.createElement('div');
                row.className = "flex justify-between items-center pt-3 first:pt-0";
                row.innerHTML = `
                    <div>
                        <div class="font-bold text-gray-800 text-sm">${item.name}</div>
                        <div class="text-xs text-gray-500">${item.price} TL x ${item.quantity}</div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeQuantity('${item.id}', -1)" class="w-8 h-8 bg-red-50 text-red-600 rounded-xl font-bold flex items-center justify-center hover:bg-red-100 transition">-</button>
                        <span class="text-sm font-bold w-6 text-center">${item.quantity}</span>
                        <button onclick="changeQuantity('${item.id}', 1)" class="w-8 h-8 bg-indigo-50 text-indigo-600 rounded-xl font-bold flex items-center justify-center hover:bg-indigo-100 transition">+</button>
                    </div>
                `;
                list.appendChild(row);
            });

            itemCount.innerText = `${totalCount} Ürün`;
            cartTotal.innerText = `${total.toFixed(2)} TL`;
        }

        // Hızlı Ekle Modalı Fonksiyonları
        function openQuickAddModal() {
            document.getElementById('quick-add-modal').classList.remove('hidden');
            document.getElementById('quick-input').value = '';
            document.getElementById('quick-input').focus();

        function closeQuickAddModal() {
            document.getElementById('quick-add-modal').classList.add('hidden');

        function addQuickItem() {
            const inputVal = document.getElementById('quick-input').value.trim();
            if (!inputVal) {
                alert("Lütfen bir not veya ürün adı girin!");
                return;
            }

            const customItem = {
                id: 'quick_' + Date.now(), // Benzersiz ID
                name: inputVal,
                price: 0,
                desc: 'Hızlı Ekle / Özel Not',
                category: 'özel'
            };

            addToCart(customItem);
            closeQuickAddModal();
        }

        function sendOrder() {
            if (cart.length === 0) {
                alert("Lütfen önce sepete ürün ekleyin!");
                return;
            }
            alert("Sipariş başarıyla mutfağa gönderildi!");
