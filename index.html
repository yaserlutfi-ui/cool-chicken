        let cart = [];
        let currentCategory = 'all';

        function renderProducts(category = 'all', searchQuery = '') {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            let filtered = category === 'all' ? products : products.filter(p => p.category === category);

            if (searchQuery.trim() !== '') {
                const query = searchQuery.toLowerCase();
                filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query));
            }

            if (filtered.length === 0) {
                grid.innerHTML = '<p class="text-gray-400 text-center col-span-full py-10 text-sm">Ürün bulunamadı.</p>';
                return;
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white p-3 rounded-xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-md cursor-pointer transition active:scale-95";
                card.onclick = () => addToCart(p);
                card.innerHTML = `
                    <div>
                        <div class="font-bold text-gray-800 text-sm mb-1">${p.name}</div>
                        <div class="text-[11px] text-gray-500 mb-2 line-clamp-2">${p.desc}</div>
                    </div>
                    <div class="text-indigo-600 font-extrabold text-base">${p.price} TL</div>
                `;
                grid.appendChild(card);
            });
        }

        function handleSearch() {
            const query = document.getElementById('search-input').value;
            renderProducts(currentCategory, query);
        }

        function openCategoryModal() {
            document.getElementById('category-modal').classList.remove('hidden');
        }

        function closeCategoryModal() {
            document.getElementById('category-modal').classList.add('hidden');
        }

        function selectCategory(categoryKey, categoryName) {
            currentCategory = categoryKey;
            document.getElementById('active-category-title').innerText = categoryName;
            document.getElementById('search-input').value = '';
            renderProducts(categoryKey);
            closeCategoryModal();
        }

        function addToCart(product) {
            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        function changeQuantity(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('cart-list');
            const itemCount = document.getElementById('item-count');
            const cartTotal = document.getElementById('cart-total');
            
            list.innerHTML = '';
            if (cart.length === 0) {
                list.innerHTML = '<p class="text-gray-400 text-center py-6 text-sm">Henüz ürün seçilmedi.</p>';
                itemCount.innerText = '0 Ürün';
                cartTotal.innerText = '0.00 TL';
                return;
            }

            let total = 0;
            let totalCount = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                totalCount += item.quantity;

                const row = document.createElement('div');
                row.className = "flex justify-between items-center pt-2 first:pt-0";
                row.innerHTML = `
                    <div>
                        <div class="font-bold text-gray-800 text-xs">${item.name}</div>
                        <div class="text-[11px] text-gray-500">${item.price} TL x ${item.quantity}</div>
                    </div>
                    <div class="flex items-center space-x-1">
                        <button onclick="changeQuantity('${item.id}', -1)" class="w-7 h-7 bg-red-50 text-red-600 rounded-lg font-bold flex items-center justify-center hover:bg-red-100">-</button>
                        <span class="text-xs font-bold w-5 text-center">${item.quantity}</span>
                        <button onclick="changeQuantity('${item.id}', 1)" class="w-7 h-7 bg-indigo-50 text-indigo-600 rounded-lg font-bold flex items-center justify-center hover:bg-indigo-100">+</button>
                    </div>
                `;
                list.appendChild(row);
            });

            itemCount.innerText = `${totalCount} Ürün`;
            cartTotal.innerText = `${total.toFixed(2)} TL`;
        }

        function openQuickAddModal() {
            document.getElementById('quick-add-modal').classList.remove('hidden');
            document.getElementById('quick-input').value = '';
            document.getElementById('quick-input').focus();
        }

        function closeQuickAddModal() {
            document.getElementById('quick-add-modal').classList.add('hidden');
        }

        function addQuickItem() {
            const inputVal = document.getElementById('quick-input').value.trim();
            if (!inputVal) {
                alert("Lütfen bir not veya ürün adı girin!");
                return;
            }

            const customItem = {
                id: 'quick_' + Date.now(),
                name: inputVal,
                price: 0,
                desc: 'Hızlı Ekle / Özel Not',
                category: 'özel'
            };

            addToCart(customItem);
            closeQuickAddModal();
        }

        function sendOrder() {
            const selectedTable = document.getElementById('table-select').value;
            if (!selectedTable) {
                alert("Lütfen önce siparişin verileceği masa numarasını seçin!");
                return;
            }

            if (cart.length === 0) {
                alert("Lütfen önce sepete ürün ekleyin!");
                return;
            }

            alert(`${selectedTable} için sipariş başarıyla mutfağa gönderildi!`);
            cart = [];
            document.getElementById('table-select').value = "";
            updateCartUI();
        }

        renderProducts();
    </script>
