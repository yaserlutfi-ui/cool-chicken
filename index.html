        let cart = [];
        let currentCategory = 'all';

        function renderProducts(category = 'all', searchQuery = '') {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            let filtered = category === 'all' ? products : products.filter(p => p.category === category);

            if (searchQuery.trim() !== '') {
                const query = searchQuery.toLowerCase();
                filtered = products.filter(p => {
                    const matchName = p.name.toLowerCase().includes(query);
                    const matchDesc = p.desc.toLowerCase().includes(query);
                    const catKeywords = categoryNames[p.category] || "";
                    const matchCategory = catKeywords.includes(query);
                    return matchName || matchDesc || matchCategory;
                });
            }

            if (filtered.length === 0) {
                grid.innerHTML = '<p class="text-gray-400 text-center col-span-full py-10 text-sm">Ürün bulunamadı. Yanındaki [+] butonuna basarak hızlıca ekleyebilirsiniz.</p>';
                return;
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white p-2 rounded-lg shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-md cursor-pointer transition active:scale-95 h-20 shrink-0";
                card.onclick = () => addToCart(p);
                card.innerHTML = `
                    <div>
                        <div class="font-bold text-gray-800 text-[11px] mb-0.5 line-clamp-2">${p.name}</div>
                    </div>
                    <div class="text-orange-600 font-extrabold text-xs mt-1">${p.price} TL</div>
                `;
                grid.appendChild(card);
            });
        }

        function handleSearch() {
            const query = document.getElementById('search-input').value;
            renderProducts(currentCategory, query);
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            renderProducts(currentCategory, '');
            document.getElementById('search-input').focus();
        }

        function scrollToSearch() {
            const searchSection = document.getElementById('search-section');
            setTimeout(() => {
                searchSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 300);
        }

        function openCategoryModal() {
            document.getElementById('category-modal').classList.remove('hidden');
        }

        function closeCategoryModal() {
            document.getElementById('category-modal').classList.add('hidden');
        }

        function selectCategory(categoryKey, categoryName) {
            currentCategory = categoryKey;
            document.getElementById('active-category-title').innerText = categoryName;
            document.getElementById('search-input').value = '';
            renderProducts(categoryKey);
            closeCategoryModal();
        }

        function addToCart(product) {
            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        function changeQuantity(id, delta) {
            const item = cart.find(i => i.id == id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id != id);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('cart-list');
            const itemCount = document.getElementById('item-count');
            const cartTotal = document.getElementById('cart-total');
            
            list.innerHTML = '';
            if (cart.length === 0) {
                list.innerHTML = '<p class="text-gray-400 text-center py-4 text-xs">Henüz ürün seçilmedi.</p>';
                itemCount.innerText = '0 Ürün';
                cartTotal.innerText = '0.00 TL';
                return;
            }

            let total = 0;
            let totalCount = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                totalCount += item.quantity;

                const row = document.createElement('div');
                row.className = "flex justify-between items-center pt-1.5 first:pt-0";
                row.innerHTML = `
                    <div>
                        <div class="font-bold text-gray-800 text-xs">${item.name}</div>
                        <div class="text-[10px] text-gray-500">${item.price} TL x ${item.quantity}</div>
                    </div>
                    <div class="flex items-center space-x-1">
                        <button onclick="changeQuantity('${item.id}', -1)" class="w-6 h-6 bg-red-50 text-red-600 rounded-md font-bold flex items-center justify-center hover:bg-red-100">-</button>
                        <span class="text-xs font-bold w-4 text-center">${item.quantity}</span>
                        <button onclick="changeQuantity('${item.id}', 1)" class="w-6 h-6 bg-orange-50 text-orange-600 rounded-md font-bold flex items-center justify-center hover:bg-orange-100">+</button>
                    </div>
                `;
                list.appendChild(row);
            });

            itemCount.innerText = `${totalCount} Ürün`;
            cartTotal.innerText = `${total.toFixed(2)} TL`;
        }

        function addSearchAsQuickItem() {
            const inputVal = document.getElementById('search-input').value.trim();
            if (!inputVal) {
                alert("Lütfen önce arama çubuğuna eklenecek ürünü yazın!");
                return;
            }

            const customItem = {
                id: 'quick_' + Date.now(),
                name: inputVal,
                price: 0,
                desc: 'Hızlı Ekle / Özel Not',
                category: 'özel'
            };

            addToCart(customItem);
            document.getElementById('search-input').value = '';
            renderProducts(currentCategory, '');
        }

        function sendOrder() {
            let selectedTable = document.getElementById('table-select').value;
            if (!selectedTable) {
                selectedTable = "Genel / Belirtilmemiş Masa";
            }

            if (cart.length === 0) {
                alert("Lütfen önce sepete ürün ekleyin!");
                return;
            }

            alert(`${selectedTable} için sipariş başarıyla mutfağa gönderildi!`);
            cart = [];
            document.getElementById('table-select').value = "";
            updateCartUI();
        }

        renderProducts();
    </script>
</body>
</html>
